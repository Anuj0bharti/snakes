
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nokia Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="game-wrapper">

        <div class="phone">

            <div class="phone-brand">NOKIA</div>
            <div class="phone-model">3310 CLASSIC</div>

            <div class="screen-frame">
                <div class="screen-header">
                    <span>SNAKE II</span>
                    <span id="battery">▰▰▰</span>
                </div>

                <div class="score-board">
                    <span>SCORE: <b id="score">0</b></span>
                    <span>BEST: <b id="highScore">0</b></span>
                </div>

                <div class="lcd">
                    <canvas id="gameCanvas"
                        width="400"
                        height="400">
                    </canvas>
                </div>

                <div class="screen-footer">
                    <span id="gameStatus">READY</span>
                    <span>1999</span>
                </div>
            </div>

            <div class="soft-keys">
                <button id="startBtn">START</button>
                <button id="pauseBtn">PAUSE</button>
            </div>

            <div class="navigation">
                <button class="nav-btn up" data-dir="up">▲</button>
                <div class="nav-middle">
                    <button class="nav-btn left" data-dir="left">◀</button>
                    <button class="nav-btn select" id="restartBtn">OK</button>
                    <button class="nav-btn right" data-dir="right">▶</button>
                </div>
                <button class="nav-btn down" data-dir="down">▼</button>
            </div>

            <div class="keypad">
                <div class="key-row">
                    <button>1</button>
                    <button>2<br><small>ABC</small></button>
                    <button>3<br><small>DEF</small></button>
                </div>
                <div class="key-row">
                    <button>4<br><small>GHI</small></button>
                    <button>5<br><small>JKL</small></button>
                    <button>6<br><small>MNO</small></button>
                </div>
                <div class="key-row">
                    <button>7<br><small>PQRS</small></button>
                    <button>8<br><small>TUV</small></button>
                    <button>9<br><small>WXYZ</small></button>
                </div>
                <div class="key-row">
                    <button>*</button>
                    <button>0<br><small>+</small></button>
                    <button>#</button>
                </div>
            </div>

            <div class="phone-bottom">
                <span>◉</span>
                <span>MADE FOR NOSTALGIA</span>
                <span>◉</span>
            </div>

        </div>

        <p class="instructions">
            DESKTOP: Arrow Keys / WASD<br>
            MOBILE: Use the navigation buttons or swipe
        </p>

    </main>

    <script src="script.js"></script>
</body>
</html>
